# MOVRIT 화면(nginx) 설정입니다.
# - 화면 주소는 모두 index.html로 돌려 React 라우터가 처리합니다(새로고침해도 404 없음).
# - /api·/uploads 요청은 같은 네트워크의 백엔드(backend:8080)로 넘깁니다. 화면과 API가 같은 주소라 CORS 문제가 없습니다.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 업로드(사진·증빙)와 요청 본문 크기 제한: 백엔드 업로드 한도에 맞춥니다.
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  # 빌드 결과의 파일 이름에는 내용 해시가 붙어 있어 오래 저장해도 됩니다.
  location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
