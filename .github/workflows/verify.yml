# 화면 자동 점검: developer·main에 올리거나 PR을 열면 GitHub 서버에서 아래를 차례로 확인합니다.
# 1) 올라온 변경에 비밀값이 섞였는지(.githooks/check-secrets.py, 값은 출력하지 않음)
# 2) 코드 규칙(ESLint)과 형식(Prettier)
# 3) 화면 규칙 단위 테스트(node --test)와 빌드
# 4) Docker 이미지가 만들어지는지(이미지는 올리지 않고 빌드만 확인)
# 실제 서버와 함께 도는 화면 점검(qa/e2e)은 DB·백엔드가 필요해 로컬에서 실행합니다.
name: Verify frontend

on:
  push:
    branches: [developer, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 비밀값 검사 · 규칙 · 테스트 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 올라온 변경의 비밀값 검사
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "검사 범위: $RANGE"
          python3 .githooks/check-secrets.py --diff "$RANGE"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 코드 규칙(ESLint)
        run: npm run lint
      - name: 형식(Prettier)
        run: npm run format:check
      - name: 화면 규칙 단위 테스트
        run: npm test
      - name: 빌드
        run: npm run build

  docker:
    name: Docker 이미지 빌드 확인
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드(올리지 않음)
        run: docker build -t movrit-frontend:ci .
