# MOVRIT 화면(nginx) 설정입니다.
# - 화면 주소는 모두 index.html로 돌려 React 라우터가 처리합니다(새로고침해도 404 없음).
# - /api·/uploads 요청은 같은 네트워크의 백엔드(backend:8080)로 넘깁니다. 화면과 API가 같은 주소라 CORS 문제가 없습니다.
# - 앞에 HTTPS 프록시(Caddy 등)가 있으면 그 프록시가 알려 준 접속 방식(https)을 그대로 백엔드에 넘깁니다.

map $http_x_forwarded_proto $movrit_forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 업로드(사진·증빙)와 요청 본문 크기 제한: 백엔드 업로드 한도에 맞춥니다.
  client_max_body_size 25m;

  # 실시간 채팅(SSE)은 이벤트가 오는 즉시 넘겨야 하므로 응답을 모아 두지 않습니다.
  # 백엔드가 25초마다 빈 신호를 보내고 연결은 최대 30분 유지되므로, 읽기 제한은 그보다 길게 둡니다.
  location = /api/chats/stream {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $movrit_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 35m;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $movrit_forwarded_proto;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $movrit_forwarded_proto;
  }

  # 빌드 결과의 파일 이름에는 내용 해시가 붙어 있어 오래 저장해도 됩니다.
  location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
